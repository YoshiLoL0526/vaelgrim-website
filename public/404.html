<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0d0b12" />
    <title>Page not found — Vaelgrim</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(ellipse at 50% 100%, rgb(208 70 60 / 22%), transparent 60%),
          #07060a;
        color: #d9d2c3;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      main {
        max-width: 36rem;
      }
      .brand {
        display: inline-block;
        margin-bottom: 2.5rem;
        color: #e8c45c;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-decoration: none;
      }
      .kicker {
        margin: 0 0 0.75rem;
        color: #ff6a3d;
        font-family: ui-monospace, 'Courier New', monospace;
        font-size: 0.8rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        color: #e8c45c;
        font-size: clamp(1.9rem, 6vw, 2.8rem);
        line-height: 1.15;
      }
      p {
        margin: 1.25rem 0 0;
        font-size: 1.05rem;
        line-height: 1.65;
        color: rgb(217 210 195 / 78%);
      }
      .es {
        font-size: 0.95rem;
        color: rgb(217 210 195 / 58%);
      }
      .btn {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.9rem 1.6rem;
        border: 1px solid #f6e2a8;
        background: linear-gradient(180deg, #f0d184, #c9a45c 55%, #a07a38);
        color: #1a0e08;
        font-family: ui-monospace, 'Courier New', monospace;
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-decoration: none;
        text-transform: uppercase;
      }
      .links {
        margin-top: 2.5rem;
        font-size: 0.9rem;
      }
      .links a {
        color: #c9a45c;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">VAELGRIM</a>
      <p class="kicker">404</p>
      <h1>This path leads into the dark.</h1>

      <p class="es">Esta página no existe. Vuelve al campamento y continúa tu leyenda.</p>
      <a class="btn" href="/">Back to Vaelgrim</a>
      <p class="links">
        <a href="https://discord.gg/cpzhmGmRm" rel="noopener">Discord</a> ·
        <a href="https://x.com/playvaelgrim" rel="noopener">X</a> ·
